[package]
name = "sift-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["fts5", "sqlite", "hnsw"]
sqlite = ["sift-store/sqlite", "sift-memory/sqlite"]
fts5 = ["sqlite", "sift-store/fts5", "sift-memory/fts5"]
fulltext = ["sift-store/fulltext", "sift-memory/fulltext"]
hnsw = ["sift-store/hnsw", "sift-memory/hnsw"]
embeddings = ["dep:sift-embed", "sift-memory/embeddings"]
memory = []
# Enable the Streamable HTTP MCP transport (in addition to stdio).
http = [
    "rmcp/transport-streamable-http-server",
    "rmcp/server-side-http",
    "rmcp/tower",
    "dep:axum",
    "dep:tokio-util",
    "dep:tower-http",
]

[dependencies]
sift-core = { workspace = true }
sift-store = { workspace = true, default-features = false }
sift-parsers = { workspace = true, default-features = false }
sift-embed = { workspace = true, default-features = false, optional = true }
sift-memory = { workspace = true }

rmcp = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
walkdir = { workspace = true }

axum = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true }
