name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  ORT_VERSION: "1.20.1"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libbz2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  installer-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint install.sh
        run: shellcheck -s sh --severity=warning install.sh
      - name: POSIX syntax check
        run: dash -n install.sh

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libbz2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ort
            ~/ort
          key: ort-${{ runner.os }}-${{ env.ORT_VERSION }}
      - run: cargo nextest run --all-features --profile ci
      - run: cargo test --doc --all-features

  binary-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libbz2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p sift-cli --features "standard,mcp,serve,completions"
      - name: Check binary size
        run: |
          size=$(stat -c%s target/release/sift)
          size_mb=$(echo "scale=1; $size / 1048576" | bc)
          echo "### Binary size: ${size_mb} MB (${size} bytes)" >> "$GITHUB_STEP_SUMMARY"
          # Fail if binary exceeds 25 MB (current ~14 MB with standard features)
          if [ "$size" -gt 26214400 ]; then
            echo "::error::Binary size ${size_mb} MB exceeds 25 MB threshold"
            exit 1
          fi
          echo "Binary size OK: ${size_mb} MB"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libbz2-dev
      - uses: dtolnay/rust-toolchain@1.75
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libbz2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-tarpaulin
      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ort
            ~/ort
          key: ort-${{ runner.os }}-${{ env.ORT_VERSION }}
      - run: cargo tarpaulin --workspace --all-features --out xml
      - uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libbz2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ort
            ~/ort
          key: ort-${{ runner.os }}-${{ env.ORT_VERSION }}
      - name: Build sift
        run: cargo build -p sift-cli --features "standard,mcp,serve"
      - name: Run benchmarks
        run: ./target/debug/sift bench all

  bench-codingmem:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libbz2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ort
            ~/ort
          key: ort-${{ runner.os }}-${{ env.ORT_VERSION }}
      - name: Build sift
        run: cargo build -p sift-cli --features "standard,mcp,serve"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install bench dependencies
        working-directory: bench
        run: uv sync
      - name: Run CodingMem benchmark (dry-run)
        working-directory: bench
        run: SIFT_BIN=../target/debug/sift uv run python eval_codingmem.py --dry-run
