[target.aarch64-unknown-linux-gnu]
# Install system dependencies needed by rusqlite (libsqlite3), ureq (openssl),
# and pdf-extract (libbz2) inside the cross-compilation Docker container.
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install -y pkg-config libssl-dev:$CROSS_DEB_ARCH libbz2-dev:$CROSS_DEB_ARCH"
]
