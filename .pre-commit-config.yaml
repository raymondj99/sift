# Pre-commit hooks that mirror the CI lint jobs.
# Install: pip install pre-commit && pre-commit install
# Manual:  pre-commit run --all-files
#
# These run the fast checks locally (fmt, clippy, deny) so problems are
# caught before pushing. The full test suite and MSRV check run in CI.

repos:
  - repo: local
    hooks:
      # ── Rust formatting (mirrors CI `fmt` job) ───────────────────────
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      # ── Clippy lints (mirrors CI `clippy` job) ───────────────────────
      # Uses default features for speed; CI runs --all-features.
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # ── License / advisory / ban checks (mirrors CI `deny` job) ──────
      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check
        language: system
        pass_filenames: false

      # ── Workspace compiles ───────────────────────────────────────────
      - id: cargo-check
        name: cargo check
        entry: cargo check --workspace
        language: system
        types: [rust]
        pass_filenames: false

      # ── Unit tests (default features, lib + bins only for speed) ─────
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --lib --bins
        language: system
        types: [rust]
        pass_filenames: false
